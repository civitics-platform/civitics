name: sync-canary-check

# FIX-234 — Daily check that the nightly sync (.github/workflows/nightly.yml at
# 02:00 UTC) actually landed a `nightly_cron` row in data_sync_log. Runs at
# 05:00 UTC, 3h after the nightly's start, so a slow-but-successful run still
# completes in time. Emails ADMIN_EMAIL via Resend when days are missing.

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sync-canary-check
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://xsazcoxinpgttgquwvuf.supabase.co
      SUPABASE_SECRET_KEY:      ${{ secrets.SUPABASE_SECRET_KEY }}
      ADMIN_EMAIL:              ${{ secrets.ADMIN_EMAIL }}
      RESEND_API_KEY:           ${{ secrets.RESEND_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run canary check
        run: pnpm --filter @civitics/data data:canary-check:ci
