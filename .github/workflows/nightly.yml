name: nightly-sync

on:
  schedule:
    # 21:00 UTC on the PREVIOUS day (FIX-1163). This slot names the following
    # UTC day's run: the cron fires Sat 21:00 for "Sunday's" nightly. See
    # NIGHTLY_SLOT_OFFSET_HOURS in each phase job's env block below — that is
    # the other half of this change and the two must move together.
    #
    # WHY 21:00 — GitHub applies a large, roughly CONSTANT OFFSET to this
    # workflow's scheduled start, not top-of-the-hour jitter. Measured from
    # `gh run list --event schedule` on 2026-09-09, the eleven consecutive
    # scheduled starts 2026-08-29 → 2026-09-09 ran 4h43–6h41 after their slot:
    #
    #   09-09 07:24:55 (slot 02:17) = 5h08     09-02 06:51:44 = 4h52
    #   09-07 07:03:38 (slot 02:00) = 5h04     09-01 07:21:57 = 5h22
    #   09-06 06:54:07              = 4h54     08-31 08:10:49 = 6h11
    #   09-05 06:43:37              = 4h44     08-30 07:57:42 = 5h58
    #   09-04 06:59:22              = 4h59     08-29 08:40:38 = 6h41
    #   09-03 06:55:25              = 4h55
    #
    # WHY :17 DID NOT WORK, AND WHY THIS IS NOT THE SAME BET — the FIX-1163
    # minute move assumed queueing at the top of the hour. Its receipt refuted
    # that: 09-09 started 5h08 after :17, squarely inside the :00 band. A
    # near-constant offset cannot be dodged with a minute; only an HOUR-level
    # move shifts the whole distribution, which is what this is. It buys 5h17.
    #
    # THE OFFSET IS CONSTANT ON A SCALE OF DAYS, NOT WEEKS. The fortnight before
    # the band above was much wider — 08-28 13:51 (11h52), 08-27 12:24 (10h24),
    # 08-26 03:04 (1h04) — and the FIX-903 header in
    # packages/data/src/pipelines/fec-bulk/drop-check.ts recorded ~3.5h earlier
    # still. So this is a shift of the distribution, not a guarantee about any
    # one run, and every observed offset lands strictly earlier here than it did
    # under 02:17. RE-MEASURE the offset on each receipt; do not treat 5h as a
    # constant of nature.
    #
    # WHERE IT PUTS THE FEC PHASE — at the measured band the run starts
    # 01:43–03:41 UTC. That is ahead of the hour-04 vacuums (ec-vacuum-analyze
    # 04:30, fe-vacuum-analyze 04:50), ahead of the 06:00 derived-MV daily, and
    # clear of the 05:45–09:00 prod blackout the old slot drifted into. It also
    # sits in the 03–05 UTC dead zone of the pg_cron startup-timeout histogram.
    #
    # CO-TENANCY, read from prod cron.job_run_details 2026-09-10:
    #   * jobid 10 refresh-derived-mvs-weekly `47 0 * * 2` — its one run at the
    #     new slot (09-08) took 1622.6s and ended 01:14 UTC, ~29 min before the
    #     band opens. At its worst historical non-failure duration (2781s) it
    #     would end 01:33, leaving ~10 min. Thin, and worth re-reading whenever
    #     that job's cost moves; the 08-11 six-hour failure would have overlapped
    #     the whole band.
    #   * jobid 49 group-donor-rollup-refresh `10 3 * * 3` — one run so far,
    #     55.7s at 03:10 UTC, i.e. inside the top of the Wednesday band. A
    #     56-second job is not a co-tenancy problem, but it is now adjacent.
    #
    # NOTE the Vercel cron canary in apps/civitics/vercel.json still fires
    # `0 2 * * *` and is deliberately NOT moved here: it only records that
    # Vercel's scheduler is alive (cron_last_started), and nothing compares it
    # against cron_last_run within a window. The two are no longer the same
    # hour, and that is fine.
    #
    # Receipt for this change is the NEXT SCHEDULED RUN's createdAt minus 21:00.
    # A run already queued under `17 2` is not it.
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      # FIX-743: force the Sunday-only heavy ingest block (FEC bulk, IRS-990,
      # LittleSis, EDGAR-weekly, OpenStates API, agencies/OPM/PLUM/elections/
      # committees/agency-*, tag-industry) to run off-Sunday. HEAVY, prod-writing,
      # IOWait-heavy on the Pro Micro — run SUPERVISED in a low-traffic window
      # only. Default false → scheduled cron + plain dispatches are unchanged.
      force_weekly:
        description: "Force weekly/heavy ingest stages (supervised off-peak run only)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# FIX-1067: this group serializes nightly-sync against ITSELF only. It is
# deliberately NOT shared with fec-backfill.yml even though both reach
# runFecBulkPipeline() and share the pipeline_state.fec_bulk_run_state resume
# cursor. A shared job-level group with cancel-in-progress:false would QUEUE
# fec-phase behind a backfill that can legitimately run three hours, and every
# enrichment-*-phase job chains off `needs: fec-phase` — so the whole nightly
# would stall (and GHA keeps only ONE pending job per group, cancelling the
# rest). Serialization is enforced in the pipeline instead, by a session-scoped
# DB advisory lock: see packages/data/src/pipelines/fec-bulk/pipeline-lock.ts.
# The losing run exits in seconds and this workflow carries on.
concurrency:
  group: nightly-sync
  cancel-in-progress: false

jobs:
  # FIX-292: runNightlySync was hitting timeout-minutes: 120 cumulatively
  # because LittleSis canonical binding consumes 60+ minutes after FEC bulk +
  # IRS 990 had already used most of the budget (observed 2026-05-14 + 2026-
  # 05-17 — both runs cancelled at exactly 2h0m wall-clock, well past where
  # FEC indiv had finished cleanly). Split into two jobs, each with its own
  # 120-min budget:
  #   fec-phase        regulations → congress → openstates-bulk → edgar-daily
  #                    → (Sunday: FEC bulk → IRS 990)
  #   enrichment-phase (Sunday: LittleSis → EDGAR weekly → USASpending →
  #                    CourtListener → OpenStates API → agencies-hierarchy →
  #                    OPM FTE → PLUM Book → elections → committees →
  #                    agency-leadership → agency-enrichment → tag-industry)
  #                    → daily MV refreshes + rule/AI taggers + AI summaries
  #                    → chord / homepage / runtime MV refreshes + prune
  # enrichment-phase `needs: fec-phase` so FEC + IRS-990 writes are flushed
  # before the LittleSis matcher builds its in-memory index (FIX-276
  # ordering is now an explicit job dependency, not implicit orchestrator
  # sequencing). Both jobs share the same env block; GHA doesn't support
  # YAML anchors so the duplication is explicit.

  fec-phase:
    runs-on: ubuntu-latest
    # FIX-689 (stopgap): raised 120→150. The Sunday FEC-bulk indiv stage
    # routinely overruns 120 min on the Pro Micro. Interim cushion until the
    # ingest-resumability PR (watermark-resumable Vercel Workflow ingest) lands
    # the durable fix; well below GHA's 6h job cap.
    #
    # FIX-1100: raised 150→300, sized off a measured kill rather than a guess.
    # 2026-08-24's PR 3b full-file replay of cycle 2026 was SIGTERM'd at 150 min
    # having finished the candidate route and reached 780,150 of 998,823 records
    # (78%) on the committee route. The 2026-08-25 resume finished the remaining
    # 22% plus independent expenditures, brackets and the small-dollar rollup in
    # 30.1 min — of which the rollup alone was 485.2 s. So a full run of the
    # 3b semantics needs ~180 min of writer time on a quiet box, and the 150 cap
    # was guaranteeing a kill on every semantics-changing replay. 300 leaves
    # ~120 min of contention headroom and still sits under GHA's 360-min job cap.
    #
    # KNOWN INTERACTION, and why FIX-1101's interlock is load-bearing: this job
    # now legitimately runs until ~08:00 UTC, which is exactly when the
    # rebuild-ec-incremental{,-mon} pg_cron jobs fire. That is the collision
    # shape that produced 2026-08-24's all-503 incident (EC rebuilding on the
    # replay's delta while the replay's own writer had just been killed).
    # Widening this budget widens that window, so the EC side must refuse to
    # START while the FEC bulk pipeline holds its advisory lock — see FIX-1101
    # decision 6. Do not raise this further without that interlock in place.
    #
    # Downstream cost: enrichment-phase carries `needs: fec-phase`, so a
    # fec-phase that uses its full budget delays enrichment by the same amount.
    # It is decoupled from the OUTCOME (FIX-462/FIX-740) but not from the wait.
    timeout-minutes: 300

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://xsazcoxinpgttgquwvuf.supabase.co
      SUPABASE_SECRET_KEY:      ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_DB_PASSWORD:     ${{ secrets.SUPABASE_DB_PASSWORD }}
      CONGRESS_API_KEY:         ${{ secrets.CONGRESS_API_KEY }}
      OPENSTATES_API_KEY:       ${{ secrets.OPENSTATES_API_KEY }}
      COURTLISTENER_API_KEY:    ${{ secrets.COURTLISTENER_API_KEY }}
      REGULATIONS_API_KEY:      ${{ secrets.REGULATIONS_API_KEY }}
      CIVITICS_ANTHROPIC_API_KEY: ${{ secrets.CIVITICS_ANTHROPIC_API_KEY }}
      AUTONOMOUS:               "true"
      CIVITICS_ENRICHMENT_MODE: queue
      # FIX-743: forwarded to runNightlySync's computeRunWeekly gate. On a
      # scheduled run `inputs.force_weekly` is empty → falsey → today's behavior.
      NIGHTLY_FORCE_WEEKLY:     ${{ inputs.force_weekly }}
      # FIX-1163: the cron above fires 21:00 UTC on the day BEFORE the run it
      # names, so the weekly gate reads the day off `now + 3h` instead of off
      # the wall clock — otherwise an ON-TIME Saturday-evening start would skip
      # Sunday's heavy FEC ingest and only a late GitHub would run it. Keep this
      # equal to (24 - cron hour); the two are one change. Scheduled runs only:
      # a workflow_dispatch passes 0 and keeps wall-clock semantics.
      NIGHTLY_SLOT_OFFSET_HOURS: ${{ github.event_name == 'schedule' && '3' || '0' }}
      # FIX-1060 — heap ceiling SIZED FROM MEASURED RSS, not from the OOM that
      # predates the external sort.
      #
      # History: FIX-236/FIX-254 set 12288 because the in-RAM indiv accumulator's
      # live set grew with the cycle, so every presidential cycle OOMed a smaller
      # ceiling and the answer was always a bigger one. FIX-961 PR 3a
      # (116da841, 2026-08-18 03:15 UTC) replaced that accumulator with an
      # external sort, which made the live set a function of the SORT BUFFER
      # instead of the file. The ceiling has been tuning a number that no longer
      # grows since that commit.
      #
      # Measured `peak_rss_mb` from data_sync_log, pipeline='fec_bulk':
      #   PRE-sort  (all of them):  2667 (08-17), 2357 + 2091 (08-09), 7337 (08-04)
      #   POST-sort (all of them):  1368 (08-19 backfill, 2.78M rows, 400k buffer)
      #                              891 (08-19 nightly)
      #                              304 (09-01, 3.65M rows) · 367 (09-07, 3.67M rows)
      #                              227–308 on the weekday no-op runs
      # The largest row count in the whole series (3.67M, 09-07) is also one of
      # the SMALLEST peaks — that is the external sort doing its job. Post-sort
      # max is 1368 MB; 4096 is 3× it, and 2× the max rounded to a power of two.
      #
      # The 100k sort buffer is what keeps 4096 honest and is therefore set
      # EXPLICITLY below rather than left to resolveSortBuffer's 400,000 default
      # (indiv.ts) — leaving it implicit is exactly the bug FIX-1060 names. The
      # three bench points: 512 heap / 25k buffer → 424 MB; 1024 / 100k → 900 MB;
      # 2048 / 400k → 2256 MB, wall-clock flat at 86–93 s across all three.
      NODE_OPTIONS: --max-old-space-size=4096
      FEC_INDIV_SORT_BUFFER: "100000"
      # ── HOLD LIFTED 2026-08-09 (was FIX-995, filed as FIX-998) ───────────
      # fec_bulk was skipped on the NIGHTLY path from 2026-08-08 because it had
      # produced zero forward progress for several nights running while
      # degrading prod for ~1.5h a night: across 2026-08-03..08-08 the fec-phase
      # job died to the 150-min timeout twice, lost its runner once, and never
      # advanced cycle 2026's donor-entities cursor past 484,000/840,338.
      #
      # FIX-1008 removed the cause (no-op re-upserts) and the 2026-08-09
      # from-zero cycle-2026 ingest completed in 75 min. The hold line
      # (`FEC_NIGHTLY_BULK_DISABLED: "true"`) is deleted; re-holding is adding
      # it back here. `FLAGS.FEC_NIGHTLY_BULK_ENABLED` stays in feature-flags.ts
      # as the kill switch — FIX-998 stays closed.
      # R2 cache for FEC bulk zips (FIX-192). All four are optional — code
      # falls through to direct FEC fetch when any are missing — but adding
      # them as repo secrets cuts ~10 min off repeat-run downloads.
      CLOUDFLARE_ACCOUNT_ID:           ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID:     ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET_CACHE:      civitics-cache

    steps:
      # FIX-963 — stamp this job's start so the mark-killed post-step can bind
      # its no-op guard to THIS run (fallback for rows predating FIX-971a's
      # metadata.github_run_id). See packages/data/src/scripts/mark-killed.ts.
      - name: Record job start (FIX-963)
        run: echo "MARK_KILLED_JOB_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run FEC phase
        run: pnpm --filter @civitics/data data:nightly:fec:ci

      # FIX-462: pass --phase so the kill-detector only considers this phase's
      # data_sync_log rows. Once enrichment-phase is decoupled (runs even when
      # fec-phase times out, below), enrichment writes its own terminal
      # nightly_cron row for the date; without phase-scoping mark-killed would
      # see that terminal row and wrongly conclude fec-phase finished.

      # FIX-290: when this job gets SIGTERM'd by `timeout-minutes`, the FEC
      # phase step above never reaches its completion-row write. The canary
      # then can't tell "never ran" from "ran but killed by workflow
      # timeout." This post-step always runs and inserts a synthetic
      # `nightly_killed` row to data_sync_log only if there's a recent
      # `nightly_cron` row stuck at status='running'. Observability, never
      # gates the job (always exits 0).
      - name: Mark nightly-killed if no completion row
        if: always()
        run: pnpm --filter @civitics/data data:mark-killed:ci -- --phase=fec

  # FIX-740: the single enrichment-phase job hit timeout-minutes: 120 on
  # cumulative INGEST overrun (2026-07-05) — LittleSis (~35 min) + EDGAR +
  # USASpending's 2 GB never-checkpointing first-run stacked past the budget.
  # USASpending was pulled OUT into usaspending-bulk.yml (workflow_dispatch);
  # the remainder is split into sub-budget jobs (the FIX-292 pattern applied
  # a level down): enrichment-heavy-phase (LittleSis alone) → enrichment-light-
  # phase (the weekly ingests) → enrichment-tail-phase (FIX-746: the daily
  # derivation tail — bridge scorer / rule + AI taggers / AI summaries / the two
  # deferred MV refreshes, split out because FIX-743 proved light was SIGTERM'd
  # mid-tail on Sunday when the ingests + tail shared one budget). Each `needs:`
  # the prior + `if: !cancelled()` so a sub-job timing out doesn't SKIP the next
  # (a timed-out job is not a run-level cancellation). All share fec-phase's env
  # block (GHA has no YAML anchors).

  enrichment-heavy-phase:
    needs: fec-phase
    # FIX-462/FIX-740: decouple from fec-phase outcome — fec-phase overruns its
    # budget every Sunday (FEC bulk indiv). `!cancelled()` still runs the
    # enrichment ingest when fec-phase fails OR times out, skipping only on a
    # whole-run cancellation. `needs: fec-phase` keeps FEC writes flushed before
    # the LittleSis matcher builds its index (FIX-276 ordering); on an overrun
    # Sunday the matcher just sees last week's FEC entities for the unlanded
    # portion — acceptable, next week reconciles.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # LittleSis is the ~35-min stage (17-min match-index build + stream 1.9M
    # rels + direct-pg upsert 601k external_relationships, FIX-741). 90 min is
    # generous headroom well under the pre-split 120.
    timeout-minutes: 90

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://xsazcoxinpgttgquwvuf.supabase.co
      SUPABASE_SECRET_KEY:      ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_DB_PASSWORD:     ${{ secrets.SUPABASE_DB_PASSWORD }}
      CONGRESS_API_KEY:         ${{ secrets.CONGRESS_API_KEY }}
      OPENSTATES_API_KEY:       ${{ secrets.OPENSTATES_API_KEY }}
      COURTLISTENER_API_KEY:    ${{ secrets.COURTLISTENER_API_KEY }}
      REGULATIONS_API_KEY:      ${{ secrets.REGULATIONS_API_KEY }}
      CIVITICS_ANTHROPIC_API_KEY: ${{ secrets.CIVITICS_ANTHROPIC_API_KEY }}
      AUTONOMOUS:               "true"
      CIVITICS_ENRICHMENT_MODE: queue
      # FIX-743: forwarded to runNightlySync's computeRunWeekly gate. On a
      # scheduled run `inputs.force_weekly` is empty → falsey → today's behavior.
      NIGHTLY_FORCE_WEEKLY:     ${{ inputs.force_weekly }}
      # FIX-1163: the cron above fires 21:00 UTC on the day BEFORE the run it
      # names, so the weekly gate reads the day off `now + 3h` instead of off
      # the wall clock — otherwise an ON-TIME Saturday-evening start would skip
      # Sunday's heavy FEC ingest and only a late GitHub would run it. Keep this
      # equal to (24 - cron hour); the two are one change. Scheduled runs only:
      # a workflow_dispatch passes 0 and keeps wall-clock semantics.
      NIGHTLY_SLOT_OFFSET_HOURS: ${{ github.event_name == 'schedule' && '3' || '0' }}
      # LittleSis bulk + matcher index build is RAM-heavy; keep the 12 GB ceiling.
      NODE_OPTIONS: --max-old-space-size=12288
      CLOUDFLARE_ACCOUNT_ID:           ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID:     ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET_CACHE:      civitics-cache

    steps:
      # FIX-963 — stamp this job's start so the mark-killed post-step can bind
      # its no-op guard to THIS run (fallback for rows predating FIX-971a's
      # metadata.github_run_id). See packages/data/src/scripts/mark-killed.ts.
      - name: Record job start (FIX-963)
        run: echo "MARK_KILLED_JOB_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run enrichment-heavy phase (LittleSis)
        run: pnpm --filter @civitics/data data:nightly:enrichment-heavy:ci

      - name: Mark nightly-killed if no completion row
        if: always()
        run: pnpm --filter @civitics/data data:mark-killed:ci -- --phase=enrichment-heavy

  enrichment-light-phase:
    needs: enrichment-heavy-phase
    # Chained after heavy (serialize the two DB writers on the Micro) but
    # decoupled from its outcome: `!cancelled()` runs the light stages even when
    # heavy times out, so EDGAR / MV refreshes / AI taggers never go dark just
    # because LittleSis overran.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # FIX-746: the weekly INGESTS only now — EDGAR (~6 min) + CourtListener +
    # OpenStates + agencies/OPM/PLUM/elections/committees/agency-* + tag-industry.
    # The daily derivation tail moved to enrichment-tail-phase (below), so light
    # no longer carries it. Much lighter than the pre-split phase (no LittleSis,
    # no USASpending, no tail); keep the proven 120-min ceiling as headroom.
    timeout-minutes: 120

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://xsazcoxinpgttgquwvuf.supabase.co
      SUPABASE_SECRET_KEY:      ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_DB_PASSWORD:     ${{ secrets.SUPABASE_DB_PASSWORD }}
      CONGRESS_API_KEY:         ${{ secrets.CONGRESS_API_KEY }}
      OPENSTATES_API_KEY:       ${{ secrets.OPENSTATES_API_KEY }}
      COURTLISTENER_API_KEY:    ${{ secrets.COURTLISTENER_API_KEY }}
      REGULATIONS_API_KEY:      ${{ secrets.REGULATIONS_API_KEY }}
      CIVITICS_ANTHROPIC_API_KEY: ${{ secrets.CIVITICS_ANTHROPIC_API_KEY }}
      AUTONOMOUS:               "true"
      CIVITICS_ENRICHMENT_MODE: queue
      # FIX-743: forwarded to runNightlySync's computeRunWeekly gate. On a
      # scheduled run `inputs.force_weekly` is empty → falsey → today's behavior.
      NIGHTLY_FORCE_WEEKLY:     ${{ inputs.force_weekly }}
      # FIX-1163: the cron above fires 21:00 UTC on the day BEFORE the run it
      # names, so the weekly gate reads the day off `now + 3h` instead of off
      # the wall clock — otherwise an ON-TIME Saturday-evening start would skip
      # Sunday's heavy FEC ingest and only a late GitHub would run it. Keep this
      # equal to (24 - cron hour); the two are one change. Scheduled runs only:
      # a workflow_dispatch passes 0 and keeps wall-clock semantics.
      NIGHTLY_SLOT_OFFSET_HOURS: ${{ github.event_name == 'schedule' && '3' || '0' }}
      NODE_OPTIONS: --max-old-space-size=12288
      CLOUDFLARE_ACCOUNT_ID:           ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID:     ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET_CACHE:      civitics-cache

    steps:
      # FIX-963 — stamp this job's start so the mark-killed post-step can bind
      # its no-op guard to THIS run (fallback for rows predating FIX-971a's
      # metadata.github_run_id). See packages/data/src/scripts/mark-killed.ts.
      - name: Record job start (FIX-963)
        run: echo "MARK_KILLED_JOB_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run enrichment-light phase
        run: pnpm --filter @civitics/data data:nightly:enrichment-light:ci

      - name: Mark nightly-killed if no completion row
        if: always()
        run: pnpm --filter @civitics/data data:mark-killed:ci -- --phase=enrichment-light

  # FIX-746: the daily derivation tail (comment bridge scorer, rule + AI taggers,
  # AI summaries) split out of enrichment-light into its own budget. FIX-743's
  # forced-weekly run proved light was squeezed past 120 min on Sunday by the
  # weekly ingest block + this tail sharing one budget (SIGTERM'd mid-tag_rules
  # → the rest of the tail never ran). Chained after enrichment-light-phase
  # (serialize the DB writers on the Micro) but decoupled from its outcome via
  # `!cancelled()` so a light-phase timeout doesn't skip the tail. The tail
  # reads DB state written by the light job, so ordering holds via the DB.
  # FIX-717/718: the two deferred MV refreshes that used to close this tail
  # (donor_party_rollup_mv + entity_connection_stats_mv) are now incremental
  # TABLEs on their own pg_cron jobs and no longer run here.
  enrichment-tail-phase:
    needs: enrichment-light-phase
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # The ~30-min AI/MV work that was getting squeezed — rule + AI taggers, AI
    # summaries, and the two capped-admin.rpc() MV refreshes. 90 min is ample
    # headroom well under the pre-split 120.
    timeout-minutes: 90

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://xsazcoxinpgttgquwvuf.supabase.co
      SUPABASE_SECRET_KEY:      ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_DB_PASSWORD:     ${{ secrets.SUPABASE_DB_PASSWORD }}
      CONGRESS_API_KEY:         ${{ secrets.CONGRESS_API_KEY }}
      OPENSTATES_API_KEY:       ${{ secrets.OPENSTATES_API_KEY }}
      COURTLISTENER_API_KEY:    ${{ secrets.COURTLISTENER_API_KEY }}
      REGULATIONS_API_KEY:      ${{ secrets.REGULATIONS_API_KEY }}
      CIVITICS_ANTHROPIC_API_KEY: ${{ secrets.CIVITICS_ANTHROPIC_API_KEY }}
      AUTONOMOUS:               "true"
      CIVITICS_ENRICHMENT_MODE: queue
      # FIX-743: forwarded to runNightlySync's computeRunWeekly gate. On a
      # scheduled run `inputs.force_weekly` is empty → falsey → today's behavior.
      NIGHTLY_FORCE_WEEKLY:     ${{ inputs.force_weekly }}
      # FIX-1163: the cron above fires 21:00 UTC on the day BEFORE the run it
      # names, so the weekly gate reads the day off `now + 3h` instead of off
      # the wall clock — otherwise an ON-TIME Saturday-evening start would skip
      # Sunday's heavy FEC ingest and only a late GitHub would run it. Keep this
      # equal to (24 - cron hour); the two are one change. Scheduled runs only:
      # a workflow_dispatch passes 0 and keeps wall-clock semantics.
      NIGHTLY_SLOT_OFFSET_HOURS: ${{ github.event_name == 'schedule' && '3' || '0' }}
      NODE_OPTIONS: --max-old-space-size=12288
      CLOUDFLARE_ACCOUNT_ID:           ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID:     ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET_CACHE:      civitics-cache

    steps:
      # FIX-963 — stamp this job's start so the mark-killed post-step can bind
      # its no-op guard to THIS run (fallback for rows predating FIX-971a's
      # metadata.github_run_id). See packages/data/src/scripts/mark-killed.ts.
      - name: Record job start (FIX-963)
        run: echo "MARK_KILLED_JOB_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run enrichment-tail phase
        run: pnpm --filter @civitics/data data:nightly:enrichment-tail:ci

      - name: Mark nightly-killed if no completion row
        if: always()
        run: pnpm --filter @civitics/data data:mark-killed:ci -- --phase=enrichment-tail

  # FIX-1176 — the receipts job. Chained after the tail phase and `if: always()`,
  # because the receipt is most valuable on the night something FAILED: a phase
  # that died still leaves its row, its peak_rss_mb and its skip_reason, and
  # those are exactly the numbers somebody will want in the morning.
  #
  # RULE 83 DOES NOT APPLY HERE. That rule governs edits to a CRON — changing a
  # schedule can drop or move a run, so it has to be timed against the slot.
  # This commit ADDS A JOB to an existing workflow and does not touch
  # `on.schedule` at all, so no run is removed or moved and it can land at any
  # time, including inside the Saturday 21:00 slot's window. The first firing is
  # simply the next scheduled nightly.
  #
  # WRITES TO THE REPO, NEVER TO PROD. The script it runs sets
  # `default_transaction_read_only = on` before its first statement, so a write
  # against the database would fail with SQLSTATE 25006 rather than land. The
  # only thing this job changes is two files under docs/receipts/.
  #
  # WHY IT CAN PUSH TO `main`. `main` carries no branch protection (checked
  # through the API on 2026-09-12: "Branch not protected"), and audit.yml has
  # been committing its dated reports straight to main under the same
  # `github-actions[bot]` identity since 2026-07 without incident. This is that
  # pattern plus a `git pull --rebase` before the push, which audit.yml does not
  # need and this does: the tail phase can finish hours after the run started,
  # so main will often have moved underneath it.
  #
  # CI COST: none. tests.yml carries `paths-ignore: ['docs/**']`, so a
  # receipts-only commit skips it; fixes-integrity.yml has no path filter and
  # does run (~2 s, pure Node, no install), which is correct and is exactly why
  # FIX-466 split the two.
  receipts:
    needs: enrichment-tail-phase
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Job-scoped, not workflow-scoped: this is the only job in nightly.yml that
    # writes to the repo, and the four phase jobs must keep `contents: read`.
    permissions:
      contents: write

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://xsazcoxinpgttgquwvuf.supabase.co
      SUPABASE_SECRET_KEY:      ${{ secrets.SUPABASE_SECRET_KEY }}
      # There is no read-only DSN secret in this repo (checked 2026-09-12), so
      # the job uses the same password the phases do and the script enforces
      # read-only in-process instead. If a read-only role is ever provisioned,
      # set SUPABASE_DB_URL here and buildDbUrl() prefers it with no code change.
      SUPABASE_DB_PASSWORD:     ${{ secrets.SUPABASE_DB_PASSWORD }}
      # Mirrors the phase jobs' expression exactly, so the file is named for the
      # same nominal day the run itself gated on (FIX-1163). A manual dispatch
      # passes 0 here and 0 there, and the two stay in step.
      NIGHTLY_SLOT_OFFSET_HOURS: ${{ github.event_name == 'schedule' && '3' || '0' }}
      # Authenticates the preinstalled `gh` for the one read that is not SQL:
      # this run's createdAt and conclusion. Without it the script records that
      # section as UNCHECKED rather than guessing.
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write the receipts file
        run: pnpm --filter @civitics/data data:receipts:daily:ci

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/receipts
          if git diff --cached --quiet; then
            echo "No receipts changes — skipping commit."
            exit 0
          fi
          DATE=$(git diff --cached --name-only | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1)
          git commit -m "docs(receipts): ${DATE:-$(date -u +%Y-%m-%d)}"
          # Rebase rather than merge: this commit touches only
          # docs/receipts/<date>.{md,json}, which nothing else writes, so there
          # is nothing for it to conflict with.
          git pull --rebase origin main
          git push origin HEAD:main
