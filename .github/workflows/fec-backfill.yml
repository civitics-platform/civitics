name: fec-backfill

# FIX-690 — RAM-safe, on-demand FEC bulk backfill against PROD.
#
# Purpose: re-ingest historical FEC cycles (notably the FIX-677 super-PAC
# individual receipts, tx type 10) that the local box can't run — the indiv
# stage needs ~12 GB heap for a presidential cycle and Craig's machine is
# RAM-blocked (12 GB indiv heap + local Docker overcommit on 16 GB). A
# 16 GB ubuntu-latest runner fits it (proven by the nightly fec-phase).
#
# This is NOT on the Sunday-gated nightly path: runFecBulkPipeline() has no
# day-gate (the gate lives only in the nightly orchestrator's weekly block), so
# `data:fec-bulk:ci` runs the full bulk pipeline — including the indiv stage —
# for whatever FEC_CYCLES is passed, any day. `--allow-prod` (in the :ci script)
# satisfies the createAdminClient prod-write guard; the prod URL + secret come
# from the same env block nightly.yml's fec-phase uses.
#
# Manual only (`workflow_dispatch`). The heavy run is a deliberate, observed
# load-test of the Micro under its heaviest write path — see the FIX-687 runbook.
# It also seeds the data that FIX-687's `full` pg_cron rebuild then reconciles.

on:
  workflow_dispatch:
    inputs:
      cycles:
        description: "Comma-separated FEC cycles to backfill (indiv stage runs for each)"
        required: true
        default: "2020,2022,2024,2026"
        type: string
      # FIX-700/701 — surgical scope filters. Empty ⇒ default ⇒ current full-run
      # behavior. Narrowing any of them marks the run "scoped" (entity aggregates
      # are NOT overwritten; re-derived by the totals stage). The FIX-677 super-PAC
      # finish uses cycles=2024, tx_types=10. The FIX-701 2024 D/B re-capture uses
      # cycles=2024, recipient_cmtes=<D/B committee list>.
      tx_types:
        description: "Override indiv tx-type filter (comma list, e.g. 10). Empty = default 15,15E,10."
        required: false
        default: ""
        type: string
      stages:
        description: "Indiv sub-stage allow-list (comma list: donor-entities,indiv-to-candidate,recipient-entities,indiv-to-committee,independent-expenditures,totals). Empty = all."
        required: false
        default: ""
        type: string
      # FIX-701 — recipient-committee allow-list. When set, only donations to
      # these committees are captured (marks the run scoped). Used for the 2024
      # D/B re-capture: pass the leadership-PAC (D) + SSF (B) committee IDs.
      recipient_cmtes:
        description: "Recipient FEC committee ID allow-list (comma list, e.g. C00…,C00…). Empty = all recipients."
        required: false
        default: ""
        type: string

permissions:
  contents: read

# FIX-1067: self-serialization only. Cross-workflow serialization against
# nightly.yml's fec-phase is enforced inside the pipeline by a session-scoped DB
# advisory lock (packages/data/src/pipelines/fec-bulk/pipeline-lock.ts), NOT by
# a shared GHA group — see the note on nightly.yml's `concurrency:` block for
# why queueing is the worse option here. A dispatch that loses the interlock
# exits cleanly in seconds with the blocking run named in its log; re-dispatch
# once that run finishes.
concurrency:
  group: fec-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    # Multi-cycle indiv ingest on the Micro is slow (IOWait-bound). 350 min
    # leaves headroom under GHA's 6h job cap. Unlike the nightly, this is not a
    # recurring budget — it's a one-off operator action.
    #
    # workflow-parity-waiver: nightly fec-phase is a recurring slice of one
    # night's budget (300 min since FIX-1100, was 150); this is a one-off
    # operator action allowed most of the 6h job cap. The gap is now only
    # 50 min, but it stays deliberate — the nightly must leave room for
    # enrichment-phase, which carries `needs: fec-phase`, and a backfill has no
    # such downstream. Deliberate divergence (FIX-961, FIX-995, FIX-1000,
    # FIX-1100).
    timeout-minutes: 350

    # DIVERGES FROM nightly.yml's fec-phase — do not assume otherwise.
    #
    # This block used to claim it "mirrors nightly.yml's fec-phase verbatim".
    # FIX-961 falsified that in the same commit that raised the heap ceiling,
    # and the stale claim survived. The two jobs both reach runFecBulkPipeline()
    # → streamIndiv on the same ubuntu-latest 16 GB runner class, but their
    # resource envelopes were set at different times for different reasons:
    #
    #   nightly.yml fec-phase : NODE_OPTIONS 12288 / timeout-minutes 150   (FIX-254, FIX-689)
    #   this job              : NODE_OPTIONS 14336 / timeout-minutes 350   (FIX-961)
    #
    # Everything else in the block IS the same set of keys as fec-phase.
    #
    # The heap divergence is deliberate and stays: FIX-995 examined the
    # 2026-08-03..08-08 nightly deaths — two job timeouts, one
    # runner-communication loss, one unrelated statement timeout, one human
    # cancel — and found NO V8 heap-limit exit in any log, so copying 14336
    # across would be tuning against a cause that was not present. 14 GB here is
    # sized for the LARGEST presidential-cycle indiv file: 12 GB fit 2024 but
    # OOM'd at ~77% of indiv20 (FIX-961); 14 GB is the most a 16 GB runner can
    # give after OS + runner agent + ~1 GB off-heap Node overhead.
    #
    # `pnpm check:workflow-parity` (scripts/check-workflow-parity.mjs, blocking
    # in tests.yml) fails on an UNDECLARED divergence between these two jobs.
    # The waiver comments are what make this one declared rather than forgotten.
    #
    # workflow-parity-waiver: sized for the largest presidential indiv file,
    # where 12288 OOM'd at ~77% of indiv20 (FIX-961). FIX-995 deliberately did
    # NOT copy this to nightly — no V8 heap-limit exit appeared in any of the
    # 2026-08-03..08-08 nightly failure logs.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://xsazcoxinpgttgquwvuf.supabase.co
      SUPABASE_SECRET_KEY:      ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_DB_PASSWORD:     ${{ secrets.SUPABASE_DB_PASSWORD }}
      CONGRESS_API_KEY:         ${{ secrets.CONGRESS_API_KEY }}
      OPENSTATES_API_KEY:       ${{ secrets.OPENSTATES_API_KEY }}
      COURTLISTENER_API_KEY:    ${{ secrets.COURTLISTENER_API_KEY }}
      REGULATIONS_API_KEY:      ${{ secrets.REGULATIONS_API_KEY }}
      CIVITICS_ANTHROPIC_API_KEY: ${{ secrets.CIVITICS_ANTHROPIC_API_KEY }}
      AUTONOMOUS:               "true"
      CIVITICS_ENRICHMENT_MODE: queue
      NODE_OPTIONS: --max-old-space-size=14336
      CLOUDFLARE_ACCOUNT_ID:           ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID:     ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET_CACHE:      civitics-cache

    steps:
      # FIX-963 — stamp this job's start so the mark-killed post-step can bind
      # its no-op guard to THIS run (fallback for rows predating FIX-971a's
      # metadata.github_run_id). See packages/data/src/scripts/mark-killed.ts.
      - name: Record job start (FIX-963)
        run: echo "MARK_KILLED_JOB_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run FEC bulk backfill (cycles=${{ inputs.cycles }})
        # FEC_CYCLES drives the cycle loop; FEC_INDIV_CYCLES defaults to it, so
        # the indiv stage runs for every requested cycle. :ci passes --allow-prod
        # (prod-write guard) and reads env from this job (no --env-file).
        #
        # FIX-700/701: tx_types/stages/recipient_cmtes pass through to the scope
        # filters. An empty input yields an empty env value, which
        # parseKeepTxTypes/parseIndivStages/parseRecipientCmtes treat identically
        # to unset — i.e. the default full-run behavior — so there is no need for
        # a shell-side "set only when non-empty" conditional.
        env:
          FEC_CYCLES: ${{ inputs.cycles }}
          FEC_INDIV_TX_TYPES: ${{ inputs.tx_types }}
          FEC_INDIV_STAGES: ${{ inputs.stages }}
          FEC_INDIV_RECIPIENT_CMTES: ${{ inputs.recipient_cmtes }}
        run: pnpm --filter @civitics/data data:fec-bulk:ci

      # Same kill-detector backstop the nightly uses: if the job is SIGTERM'd by
      # timeout-minutes mid-run, the fec_bulk data_sync_log row strands at
      # status='running'. Observability only; never gates the job.
      # --window-hours must exceed timeout-minutes (350 min ≈ 5.9h): the default
      # 4h window no-op'd on the 2026-08-03 timeout because the orphan row was
      # older than the lookback — i.e. the backstop failed precisely because the
      # job ran long (FIX-962).
      - name: Mark killed if no completion row
        if: always()
        run: pnpm --filter @civitics/data data:mark-killed:ci -- --pipeline=fec_bulk --window-hours 7
