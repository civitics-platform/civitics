name: rebuild-entity-connections

# FIX-688 — the rebuild schedule moved to pg_cron (Mon 08:00 full / Wed 08:00
# incremental, CALL public.run_entity_connections_rebuild(...)). Running it
# in-DB makes it un-killable by an external runner: it is governed by the chunk
# functions' statement_timeout, not this workflow's `timeout-minutes` budget,
# which was timing out ~3 of 4 weeks (FIX-589 IOWait on Pro Micro). The
# `schedule:` triggers below were therefore removed. This workflow is kept as
# MANUAL BREAK-GLASS ONLY (`workflow_dispatch`) — e.g. to force a rebuild from a
# GHA runner if pg_cron is ever disabled. See migrations
# 20260628000100/...000200 for the in-DB path.
#
# FIX-291 — rebuild_entity_connections (chunked, FIX-263) moved out of the
# daily nightly so the donations chunk (~90 min wall-clock) doesn't push the
# nightly past `timeout-minutes: 120`. Daily nightly stays light and
# predictable; this workflow runs twice a week with a 4-hour budget.
#
# FIX-372/FIX-373 — Round 3 split the cadence by mode:
#   * Sunday 08:00 UTC → mode=full     — calls _donations_full/_votes_full,
#                                        the safety net that catches anything
#                                        the watermark missed (deletes etc.)
#   * Wednesday 08:00 UTC → mode=incremental — donations/votes touch only the
#                                              dirty set since the last
#                                              watermark. ~95% IO reduction
#                                              expected vs full.
#
# Graph edges go stale up to ~3 days between rebuilds — accepted vs the
# 4-of-7-nights-fail baseline that came from cramming the rebuild into the
# nightly.
on:
  # FIX-688: schedule moved to pg_cron (Mon full / Wed incremental). Manual
  # break-glass only now.
  workflow_dispatch:
    inputs:
      mode:
        description: "Rebuild mode (full or incremental)"
        required: true
        default: "incremental"
        type: choice
        options:
          - incremental
          - full

permissions:
  contents: read

concurrency:
  group: rebuild-entity-connections
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # 4h budget. Donations + votes chunks are the long poles (~90 min + ~15 min
    # together on a presidential cycle). Contracts is ~5–40 min. Everything
    # else is seconds. 240 min leaves real headroom; revisit if creep past
    # 180 min becomes routine.
    timeout-minutes: 240

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://xsazcoxinpgttgquwvuf.supabase.co
      SUPABASE_SECRET_KEY:      ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_DB_PASSWORD:     ${{ secrets.SUPABASE_DB_PASSWORD }}
      # No source-pipeline API keys needed — this workflow only re-derives
      # entity_connections from already-ingested tables. Kept the heap
      # ceiling identical to nightly.yml in case a future chunk grows
      # client-side aggregations.
      NODE_OPTIONS: --max-old-space-size=12288

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine mode (FIX-372/FIX-373)
        id: mode
        # Sunday cron → full; Wednesday cron → incremental; dispatch → input.
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            if [[ "${{ github.event.schedule }}" == "0 8 * * 0" ]]; then
              echo "mode=full" >> "$GITHUB_OUTPUT"
            else
              echo "mode=incremental" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild entity_connections (mode=${{ steps.mode.outputs.mode }})
        run: pnpm --filter @civitics/data data:rebuild-connections:ci -- --mode=${{ steps.mode.outputs.mode }}

      # FIX-641: refresh official_donor_rollup_mv off the capped PostgREST path.
      # This MV was refreshed nightly via admin.rpc() (enrichment phase, step 7
      # MV loop) but is large enough that the ~8s/100s PostgREST/gateway caps
      # timed it out — staling the MV and dropping officials/[id] into its
      # 50k-row live-scan fallback. The direct-pg refresher (FIX-636) raises
      # statement_timeout on its own session and REFRESHes CONCURRENTLY, so it
      # completes reliably. Runs here (08:00 UTC window, off-peak) because the
      # MV source (FEC donations in financial_relationships) only updates on the
      # Sunday nightly — twice-weekly is ample. Independent of the rebuild's
      # outcome (different source table), so `!cancelled()` runs it even if the
      # rebuild step failed; reads SUPABASE_DB_PASSWORD + NEXT_PUBLIC_SUPABASE_URL
      # from the job env, no --env-file.
      - name: Refresh donor-rollup MV (direct-pg)
        if: ${{ !cancelled() }}
        run: pnpm --filter @civitics/data data:refresh-donor-mv:ci

      # FIX-290: if the workflow exceeds timeout-minutes mid-rebuild, the
      # entity_connections_rebuild data_sync_log row strands at
      # status='running' and the rebuild step above never reaches its
      # completeSync/failSync. This post-step writes a synthetic
      # nightly_killed row keyed to the rebuild pipeline so failures are
      # greppable. Observability, never gates the job.
      - name: Mark killed if no completion row
        if: always()
        run: pnpm --filter @civitics/data data:mark-killed:ci -- --pipeline=entity_connections_rebuild
