name: tests

# Pre-merge gate for push→main and every PR. Originally FIX-407 (the repo's first
# push/PR-triggered job, running only the source_priority drift guard); expanded by
# FIX-458 into a real gate: typecheck + lint + the full @civitics/data unit suite.
#
# Why a dedicated push/PR workflow: the other workflows (nightly.yml, audit.yml,
# sync-canary-check.yml, platform-snapshot.yml, rebuild-entity-connections.yml) are
# all scheduled data-pipeline crons. A check bolted onto one of them only fires on
# its cron cadence — not on the commit that introduces the regression. This runs
# synchronously with the change.
#
# Scope (FIX-458): typecheck + lint + unit tests. BUILD is intentionally excluded —
# Vercel runs `next build` (which typechecks the app) on every push, so a CI build
# duplicates it, and `turbo run build` needs the full secret set from turbo.json's
# build.env list provisioned as Actions secrets (a separate, Craig-owned concern).
#
# Gate health is baseline-first: only green-across-all-packages steps are blocking.
#  - typecheck: GREEN across all 10 packages → blocking.
#  - lint:      eslint toolchain wired by FIX-459 (@civitics/config presets +
#               per-package .eslintrc); `turbo run lint` GREEN across all 9
#               (0 errors, ~76 warnings allowed) → blocking. The warning backlog
#               ratchet to zero + `--max-warnings 0` is FIX-460.
#  - unit:      @civitics/data suite (run-tests.mjs discovers every src/**/*.test.ts)
#               → GREEN → blocking.
#
# Split (FIX-466): the cheap fixes-integrity guard (FIX-461) moved to its own
# .github/workflows/fixes-integrity.yml. The autonomous loop pushes many pure
# docs/status commits (chore(fixes): sync … touching only docs/done.log +
# docs/FIXES.md), and spinning the heavy `unit` job up for those just to cancel it
# is wasted runner time. So `unit` now carries `paths-ignore: ['docs/**']` and skips
# docs-only changes (mixed docs+code commits still run it — paths-ignore only skips
# when EVERY changed path matches). The guard could NOT share this filter: a bad
# fixes:sync (the FIX-461 failure mode) lands as a docs-only done.log change, so it
# must keep firing on exactly the commits this filter skips — hence a separate
# workflow with no path filter, not a per-job `if:` (path filters are workflow-level).
#
# Branch-protection caveat: a workflow skipped by `paths-ignore` reports NO status.
# Nothing requires these checks today (no branch protection), so this is safe. But if
# required checks are later enabled, a required `tests / unit` check would sit pending
# and block docs-only merges — add the standard "skipped→success" companion job then.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Blocking — green across all 10 packages. `^build` resolves to no-ops
      # (no package has a build script), so this is pure tsc and needs no secrets.
      - name: Typecheck
        run: pnpm turbo run typecheck

      # Blocking (FIX-459). The eslint toolchain is now wired: @civitics/config
      # exports the base + next presets, every package/app has an .eslintrc that
      # extends them, and `turbo run lint` is GREEN across all 9 (0 errors). A
      # backlog of ~76 warnings remains — allowed for now; driving them to zero
      # and adding `--max-warnings 0` is the ratchet follow-up (FIX-460).
      - name: Lint
        run: pnpm turbo run lint

      # Blocking (FIX-546) — flags `const { data }` PostgREST reads with no
      # error check in packages/data + packages/db (the FIX-545/FIX-422
      # silent-zero class). Opt-out per read via a `// reads-ok: <reason>`
      # comment. Pure grep, no DB or secrets needed.
      - name: Silent-read guard
        run: pnpm check:reads

      # Blocking — flags page-render PostgREST reads under apps/civitics/app/**
      # (excl. api routes, client components, generateStaticParams, build-time
      # metadata routes) that aren't wrapped in withDbTimeout. Vercel bills
      # provisioned memory while a function is blocked on I/O, so an unwrapped
      # slow query makes a render hang and accrue GB-hours — the P0 cost defense.
      # Opt-out per read via `// db-timeout-exempt: <reason>`. Pure grep, no DB
      # or secrets needed.
      - name: Render-timeout guard
        run: pnpm check:render-timeouts

      # Blocking — run-tests.mjs discovers every src/**/*.test.ts under @civitics/data
      # (source-priority drift guard, congress reconcile, fec-bulk indiv fingerprint).
      - name: Unit tests
        run: pnpm --filter @civitics/data test
