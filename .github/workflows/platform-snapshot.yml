name: platform-snapshot

# THIS WORKFLOW NO LONGER TRIGGERS THE SNAPSHOT. It exists for the
# `request-path-probe` job (FIX-1026) — the platform's only outage pager.
#
# The name and the `*/10` schedule are deliberately unchanged: the probe's
# alerting history, the notification routing, and every reference in
# docs/OPERATIONS.md key off this filename and job name, and renaming a pager
# costs archaeology for no benefit.
#
# HISTORY OF THE SNAPSHOT TRIGGER, because the reasoning matters more than the
# deleted job did:
#
#   FIX-281 put /api/cron/platform-snapshot on a GHA `*/10` schedule because
#   Vercel Hobby rejected cron expressions more frequent than daily. This
#   header used to claim the resulting drift was "~5-15 min", well inside a
#   "20-minute staleness window". Both numbers were wrong.
#
#   FIX-1127 (2026-08-29) measured the actual scheduled firings over 51 hours:
#   08-27T15:08, 08-28T00:23, 08-28T11:35, 08-28T21:30, 08-29T03:20,
#   08-29T10:16, 08-29T15:05, 08-29T18:23. Eight firings, mean interval ~6.4 h,
#   shortest gap 3.2 h, against an advertised 10 minutes. GitHub drops
#   scheduled runs under platform load and offers no delivery guarantee — this
#   is wholesale skipping, not drift, and no staleness threshold tuned against
#   a `*/10` expression was ever describing reality.
#
#   The trigger job therefore moved to a Vercel cron (`*/30 * * * *` in
#   apps/civitics/vercel.json), which the project has been able to use since
#   the April Pro cutover. The route needed no change — it already accepted
#   the Bearer <CRON_SECRET> header Vercel's own cron sends.
#
#   READ THE OBSERVED RUN HISTORY, NEVER THE CRON EXPRESSION. That applies to
#   the probe below exactly as much as it applied to the trigger: this
#   workflow's `*/10` still means roughly hourly in practice, and the probe's
#   own header states its detection latency honestly on that basis.
#
# Required GitHub Actions secrets (CRON_SECRET is no longer among them — it
# left with the trigger job, and lives on only as a Vercel project env var):
#   - CIVITICS_APP_URL      — e.g. https://civitics-civitics.vercel.app
#                             (falls back to the production URL below if unset)
#   - PROBE_URL             — https://civitics.com since FIX-1057 (2026-09-04).
#                             Kept SEPARATE from CIVITICS_APP_URL on purpose;
#                             see the probe step's note.
#   - PROBE_HEADER_SECRET   — REQUIRED since FIX-1057. The value the Cloudflare
#                             WAF rule "Probe skip (FIX-1057)" matches on to
#                             skip the Under Attack security level. Rotate it
#                             in the WAF rule and here TOGETHER.
#   - PROBE_OFFICIAL_ID     — optional; an officials.id the probe fetches
#                             (falls back to the id below if unset)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

# NOTE (FIX-1026): there is deliberately NO workflow-level `concurrency:` block,
# and its absence is load-bearing — see the request-path-probe job's header. A
# workflow-level `cancel-in-progress` makes the whole RUN's conclusion
# `cancelled` when any job is cut short, and GitHub sends no notification for a
# cancelled run. That is what silently swallowed the 2026-08-11 outage signal.
# The concurrency group this note used to describe belonged to the `trigger`
# job, which FIX-1127 removed; do not reintroduce one at either level.

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # FIX-1026 — external request-path probe.
  #
  # WHY IT RIDES THIS WORKFLOW rather than getting its own schedule: GHA cron is
  # unreliable at tight cadences and adding a second scheduled workflow buys
  # nothing. MEASURED from this workflow's own run history (observed starts, not
  # the cron expression — playbook D2 applied to GHA): configured `*/10`, actual
  # gaps on 2026-08-11..12 were 38, 50, 56, 63, 87, 107 and 153 minutes. So the
  # effective cadence is roughly hourly, with a two-and-a-half-hour tail.
  #
  # WHAT THIS BUYS, STATED HONESTLY: detection latency of about ONE HOUR, not
  # minutes. The 2026-08-11 outage ran 14 hours undetected, so this is a ~10x
  # improvement at zero new cost — but it is NOT minutes-scale monitoring. True
  # minutes-scale detection needs an EXTERNAL uptime service (e.g. UptimeRobot's
  # free 5-minute checks), which is zero repo code and lives entirely in that
  # service's dashboard. That gap is real and deliberately left visible here.
  #
  # WHY IT IS A SEPARATE JOB, NOT A STEP: when this workflow still carried the
  # snapshot `trigger` job (removed by FIX-1127), a step appended to it would
  # have been indistinguishable from snapshot flakiness in the failure
  # notification. As its own job with an unambiguous name, a red
  # `request-path-probe` reads as "the site is down" and nothing else. That is
  # now also why it is the ONLY job here: nothing else can turn this workflow
  # red, so red means down.
  #
  # WHY IT MUST NOT CARRY A CONCURRENCY GROUP — the finding that shaped this
  # whole job. During the 2026-08-11 outage the five platform-snapshot runs
  # at 08:28, 09:31, 10:27, 11:17 and 12:00 UTC all hung on the unreachable site
  # and were cut off by `timeout-minutes: 5`. GitHub reports a timeout-expired
  # job as **cancelled**, not failed, and sends NO notification for a cancelled
  # run. The signal existed, spanned the outage exactly, and was structurally
  # incapable of paging anyone. So this job:
  #   * carries no concurrency group at all, so a subsequent run never cancels it
  #   * bounds every curl with --max-time and exits non-zero ITSELF
  #   * has a worst case (~3.5 min) far inside its own timeout-minutes, so it
  #     can only ever finish as success or FAILURE — never `cancelled`
  #
  # This is therefore alerting on a signal that already existed, not new
  # monitoring.
  #
  # WHERE THE PAGE GOES: GitHub emails scheduled-workflow failures to the account
  # that last committed the workflow file — currently
  # `Civitics Platform <civitics.platform@gmail.com>` (96c2204c). If that inbox
  # is not watched, this alert is decorative; forward it or add a notification
  # integration. See docs/OPERATIONS.md § Monitoring.
  # ───────────────────────────────────────────────────────────────────────────
  request-path-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deliberately NO `concurrency:` here. See header.

    steps:
      # WHICH HOST THIS TESTS (FIX-1057 — RESOLVED 2026-09-04).
      #
      # This probe now hits https://www.civitics.com, so it traverses Cloudflare
      # THEN Vercel, which is the path a real user takes.
      #
      # IT IS THE www HOST, NOT THE APEX, AND THAT IS NOT A TYPO. The apex
      # answers 307 to https://www.civitics.com/ (measured 2026-09-04, with the
      # probe header, so this is the redirect and not the challenge). This job
      # asserts an exact 200 and does not pass -L, so pointing it at the apex
      # would fail every run on the redirect — the same permanently-red-pager
      # outcome FIX-1057 exists to avoid. The FIX-1057 bullet and the 2026-08-17
      # measurements both say "civitics.com"; they were recording the challenge,
      # which the apex returns before it ever gets to redirect.
      #
      # Consequence worth knowing: nothing here watches the apex redirect. If
      # civitics.com stopped redirecting, this job would stay green.
      #
      # THE BLIND SPOT IT USED TO HAVE, kept because it is the reason the rule
      # below exists: until 2026-09-04 this job curled the VERCEL ORIGIN
      # (vercel.app) and was structurally blind to every Cloudflare-layer
      # failure. Not theoretical — on 2026-08-12 civitics.com served Cloudflare
      # 526 (expired ORIGIN cert) for much of the day while the vercel.app URL
      # kept working, and this job stayed GREEN through the whole outage. Same
      # shape as the 2026-08-11 522 it was built for.
      #
      # WHY IT COULD NOT SIMPLY BE REPOINTED, until now. Measured 2026-08-17
      # against the live zone, all three probe paths returned HTTP 403 with
      # `Cf-Mitigated: challenge` — including with a browser User-Agent —
      # because `security_level` is `under_attack`:
      #
      #   curl https://civitics.com/                         -> 403
      #   curl https://civitics.com/officials                -> 403
      #   curl https://civitics.com/api/officials/<id>/responsiveness -> 403
      #
      # Repointing then would have made this job fail every hour forever, which
      # is strictly worse than the blind spot — a permanently-red pager is a
      # disabled pager.
      #
      # The zone is STILL at under_attack. What unblocked the flip was the WAF
      # skip rule described on the step below, which admits this probe by a
      # secret header and nothing else. Re-verified 2026-09-04 WITH the header:
      # all three paths return 200 and no Cf-Mitigated header.
      #
      # STILL OPEN, and unchanged by this: an external uptime service
      # (UptimeRobot etc.) is still blocked by the same Under Attack setting,
      # so true minutes-scale third-party monitoring remains unavailable. The
      # FIX-1130 watchdog closes part of that gap from the inside, on a
      # 15-minute Vercel cron.
      #
      # RESOLVED 2026-09-04 (FIX-1057) VIA OPTION (b) — the WAF skip rule.
      #
      # The zone STAYS at security_level=under_attack; that posture is a human
      # setting and part of the cost program, and nothing here touches it. What
      # changed is a single Cloudflare WAF custom rule, "Probe skip (FIX-1057)":
      #
      #   expression: (http.request.headers["x-civitics-probe"][0] eq "<secret>")
      #   action:     Skip -> Security Level ONLY
      #
      # "all remaining custom rules" is deliberately UNCHECKED, so Common
      # Exploit Paths still applies to the probe's requests — the rule buys this
      # job past the Under Attack challenge and nothing else. The key is a
      # secret header rather than a UA or an IP allowlist because the runner's
      # egress IP is not stable and a UA is trivially forgeable.
      #
      # PROBE_URL is now https://civitics.com, so this job finally tests the
      # path a real user takes: Cloudflare THEN Vercel. CIVITICS_APP_URL is
      # deliberately still the vercel.app origin — other consumers read it and
      # repointing it would change their behaviour too (that is the FIX-1057
      # landmine; do not "tidy" the two into one).
      #
      # ROTATING THE SECRET: it lives in exactly two places, the GHA secret
      # PROBE_HEADER_SECRET and the WAF rule expression. Change both together;
      # changing only one turns this job permanently red, which is the same
      # disabled-pager failure the whole FIX was avoiding.
      #
      # If the header is ever absent or wrong the request gets the Under Attack
      # challenge and this job goes red on a 403 — verified 2026-09-04 by
      # curling without the header. That is a real signal about the rule, not a
      # false alarm about the site, so read the log before assuming an outage.
      - name: Probe key request-path endpoints
        env:
          APP_URL: ${{ secrets.PROBE_URL || secrets.CIVITICS_APP_URL || 'https://civitics-civitics.vercel.app' }}
          OFFICIAL_ID: ${{ secrets.PROBE_OFFICIAL_ID || '5201c5c4-7b93-4042-a74f-d494a20e74de' }}
          PROBE_HEADER_SECRET: ${{ secrets.PROBE_HEADER_SECRET }}
        run: |
          set -uo pipefail

          # Three surfaces:
          #   /                                 homepage SSR
          #   /officials                        DB-backed index page
          #   /api/officials/<id>/responsiveness  an official-page API
          #
          # THE "ALL THREE ARE X-Vercel-Cache: MISS" CLAIM IS NO LONGER TRUE OF
          # THE FIRST ONE. That was verified on 2026-08-12 against the vercel.app
          # origin. Re-measured 2026-09-04 through Cloudflare against
          # www.civitics.com: `/` answers `x-vercel-cache: HIT`, so it CAN serve
          # from the CDN while the database is unreachable and its arm of this
          # probe is decorative on a DB-down outage. `/officials` and
          # `/api/.../responsiveness` are both still MISS, so the job as a whole
          # still fails closed — and `/responsiveness` was chosen precisely
          # because it 500s on a DB error (see below). Filed as FIX-1143.
          #
          # The official-page API is /responsiveness and NOT /summary, and that
          # choice is deliberate: /summary FAILS OPEN. Its own header says the
          # `summary: null` variants (kill switch, spend cap, no data, DB error)
          # are returned unstamped — i.e. it answers HTTP 200 when the database
          # is unreachable, which makes it blind to exactly the outage this job
          # exists to catch. /responsiveness returns HTTP 500 on a DB error
          # (route.ts:36 and :111). Verified both ways against prod.
          #
          # KNOWN LIMIT: the two page routes have not been proven to fail closed
          # on a DB-down-but-Vercel-up partial outage. On the failure mode this
          # job was built for — 2026-08-11, Cloudflare 522, origin unreachable —
          # every endpoint fails, so the probe fires. A partial outage rests on
          # /responsiveness alone.
          PATHS=(
            "/"
            "/officials"
            "/api/officials/${OFFICIAL_ID}/responsiveness"
          )

          ATTEMPTS=3
          BACKOFF=20
          FAILED=()

          for path in "${PATHS[@]}"; do
            url="${APP_URL}${path}"
            ok=0
            for attempt in $(seq 1 "${ATTEMPTS}"); do
              # --max-time is what turns "hangs until the job is killed" into
              # "fails fast with a conclusion GitHub will notify on".
              # `|| code=000` rather than `|| echo 000`: on a connection error
              # curl still prints its own "000" via -w, so echoing a second one
              # produced "000000". -sS is kept so curl's reason reaches the log.
              # The x-civitics-probe header is what the WAF "Probe skip
              # (FIX-1057)" rule matches to skip the Under Attack security
              # level. Without it every one of these returns 403 with
              # Cf-Mitigated: challenge. Sent unconditionally — when the
              # secret is unset it is an empty header, which matches nothing
              # and simply gets challenged, so the failure is loud rather than
              # silent.
              code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 25 \
                -H "x-civitics-probe: ${PROBE_HEADER_SECRET}" "${url}") || code="000"
              if [ "${code}" = "200" ]; then
                echo "ok   ${path} (HTTP 200, attempt ${attempt}/${ATTEMPTS})"
                ok=1
                break
              fi
              echo "warn ${path} → HTTP ${code} (attempt ${attempt}/${ATTEMPTS})"
              if [ "${attempt}" -lt "${ATTEMPTS}" ]; then sleep "${BACKOFF}"; fi
            done
            if [ "${ok}" -ne 1 ]; then FAILED+=("${path}"); fi
          done

          if [ "${#FAILED[@]}" -gt 0 ]; then
            echo "::error::request path is DOWN — ${#FAILED[@]} of ${#PATHS[@]} endpoint(s) failed ${ATTEMPTS} attempts each: ${FAILED[*]}"
            exit 1
          fi
          echo "request path healthy — ${#PATHS[@]}/${#PATHS[@]} endpoints returned 200"
