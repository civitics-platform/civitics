name: weekly-integrity-audit

# FIX-226 — Weekly read-only integrity audit against prod. The audit produces
# dated {YYYY-MM-DD}.md + .json reports under docs/audits/ and commits the
# markdown back to main, so regressions in invariants surface as diffs in
# `git log docs/audits/`.
#
# FIX-1424 (cc-292) — Tuesday 17:00 UTC, started ON TIME. The old `0 4 * * 1`
# reasoned from a 02:00 UTC Sunday nightly that no longer exists (the nightly
# is 21:00 UTC); Monday is now the post-landing pass, and GitHub started this
# workflow 6–8 h late every week (10-26 09:44Z, 11-02 11:59Z, 11-09 12:32Z,
# 11-16 12:26Z — the last inside the stall, cancelled at its 30 min timeout, so
# no 11-16 report exists). A Vercel cron fires /api/cron/gha-dispatch/audit at
# `0 17 * * 2` (apps/civitics/vercel.json; FIX-1218's route), which POSTs
# workflow_dispatch: after the pass, two hours behind irs990's 15:00 UTC. The
# report's file is still named for the run's UTC date, so it is now a Tuesday.
# There is NO `schedule:` fallback: a second start hours later is what this
# removes. pipeline_state.gha_dispatch_audit and the canary say if the dispatch
# was refused or never called; `gh workflow run audit.yml` starts it by hand.
# The commit step pushes without a rebase, so a landing on main inside the run's
# few minutes fails the push; no scheduled job pushes near Tuesday 17:00 UTC
# (the receipts commit follows the 21:00 nightly, the housekeep bot is Monday).

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weekly-integrity-audit
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://xsazcoxinpgttgquwvuf.supabase.co
      SUPABASE_SECRET_KEY:      ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_DB_PASSWORD:     ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run integrity audit
        run: pnpm --filter @civitics/data data:audit:ci -- --out docs/audits

      - name: Commit and push report
        run: |
          DATE=$(date -u +%Y-%m-%d)
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "docs/audits/${DATE}.md" "docs/audits/${DATE}.json"
          if git diff --cached --quiet; then
            echo "No audit report changes for ${DATE} — skipping commit."
            exit 0
          fi
          git commit -m "chore(audit): weekly integrity report ${DATE}"
          git push
