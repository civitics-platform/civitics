name: usaspending-bulk

# FIX-740 — USASpending bulk ingest, pulled out of the nightly enrichment phase.
#
# Why its own workflow: the "full" contract archive is ~2 GB compressed. A
# first-run never completed inside the enrichment phase's 120-min budget — it
# processed ~200k rows, got SIGTERM'd at the cutoff, wrote no checkpoint, and
# restarted as a "first run — no prior state" every night, cumulatively starving
# the rest of enrichment (LittleSis, EDGAR, the MV-refresh/tagger tail). Moving
# it here stops that starvation. FIX-739 then shipped the DB-backed
# checkpoint/resume state (pipeline_state.usaspending_bulk_state), so the delta
# baseline is live: a scheduled run is a cheap delta (~32s when no new archive
# has landed; a real delta is minutes, not the 2 GB first-run).
#
# Manual (`workflow_dispatch`) only since 2026-10-08, under FIX-1291. The weekly
# Thu 10:00 UTC schedule (FIX-790) came off after its 10-08 firing ran 5 h 52 m
# to the 350-min cap as a prod writer outside every P1-A gate (no FIX-950 claim,
# no box gate, no budget, no vacuum tail), saturated the box and completed
# neither category. The remaining catch-up runs as a supervised, claimed op. The
# schedule returns with the FIX-1274 code shapes (the Full listing inside the
# !baseline arm, a per-part checkpoint for delta mode, the gha-dispatch route).
# Deliberately NOT rejoining the nightly: its 120-min budget is exactly what
# FIX-740 pulled this out of.
#
# FIX-1274 (2026-10-10) landed shapes (1) and (3): every run — delta too —
# checkpoints per CSV part and resumes; the FR upsert skips unchanged rows; the
# box gate (box_backoff_gate) is read before each part and every 100k rows; the
# run heartbeats its data_sync_log row so the nightly's reaper spares it; and
# a CI run claims nothing — it reads prod_session_state() and writes `skipped`
# when a supervised session holds the box. The dials (packages/data/src/
# pipelines/usaspending-bulk/flags.ts): --category, --max-parts,
# --max-minutes, --gate-wait-s, --breather-s, --keep-archive. This workflow
# passes `--max-minutes 320`, so the 350-min cap below becomes a soft stop at a
# part boundary (a `partial` row that the next dispatch resumes), never a
# SIGTERM. The schedule's return is FIX-1274 shape (2), later (FIX-1291 step 4).
# Runs both categories (contracts then assistance) sequentially against PROD
# via `data:usaspending-bulk:ci` (index.ts `usaspending` command →
# runUsaSpendingBulk). `--allow-prod` on the :ci script satisfies
# createAdminClient's prod-write guard; the prod URL + secret come from the
# same env block nightly.yml's fec-phase uses (GHA has no YAML anchors, so the
# duplication is explicit). Each category self-logs to data_sync_log via its
# own startSync/completeSync. The concurrency group serializes a second
# dispatch behind any in-flight one (and a scheduled firing, once one returns).

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: usaspending-bulk
  cancel-in-progress: false

jobs:
  usaspending-bulk:
    runs-on: ubuntu-latest
    # The 2 GB full first-run is slow (stream + per-row filter/upsert). 350 min
    # leaves headroom under GHA's 6h job cap — same one-off ceiling fec-backfill
    # uses. This is a supervised operator action, not a recurring budget.
    timeout-minutes: 350

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://xsazcoxinpgttgquwvuf.supabase.co
      SUPABASE_SECRET_KEY:      ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_DB_PASSWORD:     ${{ secrets.SUPABASE_DB_PASSWORD }}
      CONGRESS_API_KEY:         ${{ secrets.CONGRESS_API_KEY }}
      OPENSTATES_API_KEY:       ${{ secrets.OPENSTATES_API_KEY }}
      COURTLISTENER_API_KEY:    ${{ secrets.COURTLISTENER_API_KEY }}
      REGULATIONS_API_KEY:      ${{ secrets.REGULATIONS_API_KEY }}
      CIVITICS_ANTHROPIC_API_KEY: ${{ secrets.CIVITICS_ANTHROPIC_API_KEY }}
      AUTONOMOUS:               "true"
      CIVITICS_ENRICHMENT_MODE: queue
      NODE_OPTIONS: --max-old-space-size=12288
      CLOUDFLARE_ACCOUNT_ID:           ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID:     ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET_CACHE:      civitics-cache

    steps:
      # FIX-963 — stamp this job's start so the mark-killed post-step can bind
      # its no-op guard to THIS run (fallback for rows predating FIX-971a's
      # metadata.github_run_id). See packages/data/src/scripts/mark-killed.ts.
      - name: Record job start (FIX-963)
        run: echo "MARK_KILLED_JOB_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --max-minutes 320: a soft stop at a part boundary 30 min under the cap.
      - name: Run USASpending bulk (contracts + assistance)
        run: pnpm --filter @civitics/data data:usaspending-bulk:ci -- --max-minutes 320

      # Same kill-detector backstop the nightly/backfill use: if SIGTERM'd by
      # timeout-minutes mid-run, the data_sync_log row strands at
      # status='running' — or at 'reaped', if the nightly's reaper got to it
      # first, which mark-killed now treats as an orphan too (FIX-1291).
      # --window-hours 6: sized on the job's 350-min CAP, not the default 4 h
      # (FIX-962's lesson, missed here until 10-08). One step per category.
      # Observability only; never gates the job.
      - name: Mark killed if no completion row (contracts)
        if: always()
        run: pnpm --filter @civitics/data data:mark-killed:ci -- --pipeline=usaspending_bulk --window-hours 6

      - name: Mark killed if no completion row (assistance)
        if: always()
        run: pnpm --filter @civitics/data data:mark-killed:ci -- --pipeline=usaspending_bulk_assistance --window-hours 6