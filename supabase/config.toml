# Supabase local dev configuration
# Run `supabase stop && supabase start` after editing this file.

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = ""

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.image_transformation]
enabled = false

[auth]
enabled = true
# Use localhost everywhere so magic-link cookies and redirects stay on the
# same origin as the Next.js dev server.
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/**",
  "http://127.0.0.1:3000/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 6
password_requirements = ""

# ── Bot protection (FIX-568) ────────────────────────────────────────────────
# Cloudflare Turnstile, enforced SERVER-SIDE by Supabase Auth: sign-up / sign-in
# / OTP requests without a valid captcha token are rejected by GoTrue — no custom
# auth gate needed. Mode is managed/invisible (near-zero human friction). Local
# dev uses Cloudflare's published always-pass TEST keys (secret
# 1x0000000000000000000000000000000AA) via TURNSTILE_SECRET_KEY in the env the
# Supabase stack reads; PROD mirrors this block in the dashboard (Authentication →
# Bot and Abuse Protection) — dashboard config is separate from this file.
[auth.captcha]
enabled = true
provider = "turnstile"
secret = "env(TURNSTILE_SECRET_KEY)"

# Auth-endpoint throttles (FIX-568). Conservative caps on the send + verify
# surfaces to blunt email-bomb / enumeration / Supabase email-quota cost. NB:
# raising email_sent above the platform default requires custom SMTP — the
# default is conservative, which suits us. Mirror in the prod dashboard
# (Authentication → Rate Limits). The auth/actions.ts preflight is the
# app-controlled belt-and-braces layer on top of these.
[auth.rate_limit]
# OTP / magic-link emails per hour (project-wide).
email_sent = 10
# Per-IP over a 5-minute sliding window:
sign_in_sign_ups = 30
token_verifications = 30
token_refresh = 150
# Anonymous sign-ins are disabled (enable_anonymous_sign_ins=false) but pin a
# conservative cap anyway so enabling it later can't silently open a hole.
anonymous_users = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
otp_expiry = 3600
otp_length = 6

[auth.email.smtp]
# Uses inbucket by default — no changes needed for local dev.
enabled = false

[auth.email.template.magic_link]
subject = "Your Civitics sign-in code"
content_path = "./supabase/templates/magic_link.html"

[auth.sms]
enable_signup = false
enable_confirmations = false

# FIX-573: Google OAuth — cheaper to farm-resist than email OTP, and lowers
# email-OTP send volume. Creds are env-driven so secrets stay out of this
# committed file (local reads .env.local; PROD is configured in the Supabase
# dashboard, which does NOT read this file). GitHub stays disabled — dev
# audience, not the civic user base; each provider is a separate creds burden.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
redirect_uri = ""
url = ""
skip_nonce_check = false

[auth.external.github]
enabled = false
client_id = ""
secret = ""
redirect_uri = ""
url = ""
skip_nonce_check = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[analytics]
enabled = false
